appId: ${APP_ID:-com.pkcarreno.cron.preview}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "menu-screen"
- tapOn:
    id: "input-number-trigger"
- assertVisible:
    id: "thumbwheel-picker"
- runScript:
    file: ../scripts/sleep.js
    env:
      durationMs: 500
- swipe:
    start: "80%, 75%"
    end: "20%, 75%"
    duration: 800
- waitForAnimationToEnd
- runScript:
    file: ../scripts/sleep.js
    env:
      durationMs: 1000
- swipe:
    start: "20%, 75%"
    end: "80%, 75%"
    duration: 800
- waitForAnimationToEnd
- runScript:
    file: ../scripts/sleep.js
    env:
      durationMs: 1000
- tapOn:
    id: "number-picker-save-button"
- assertVisible:
    id: "menu-screen"
